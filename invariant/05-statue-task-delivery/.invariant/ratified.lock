{
  "ratified": {
    "by": "gitdek",
    "at": "2026-11-10T02:26:57Z",
    "issue": 27,
    "comment": "https://github.com/gitdek/ask3d/issues/27#issuecomment-6757229637",
    "proposal": "sha256:5c5a473697ba1658008d6c81f17ff9a86acd158008f2c669ea8b410e8be4c6da"
  },
  "bounds": {
    "MaxMounts": "2",
    "MaxTasks": "2",
    "Names": "{\"source-statue-1.stl\", \"source-statue-2.stl\", \"recovered-statue-1.stl\", \"recovered-statue-2.stl\"}",
    "PollLimit": "5"
  },
  "statements": [
    {
      "name": "Spec",
      "kind": "spec",
      "says": "The hook follows these lifecycle steps within two tasks and two mounts, with direct runs for each regression witness alongside random runs.",
      "sha256": "sha256:c0b27ebc20f99369344633b546c7fb5bc1ce617d6267d885aa27451bf1db5880"
    },
    {
      "name": "DeliveredAtMostOnce",
      "kind": "invariant",
      "says": "Each task has at most one completed delivery callback across all mounts; rejected callbacks do not count.",
      "sha256": "sha256:0051b71afd3bc73bd368477bb51424874ce6bca5233a07bc4d940737c54c159b"
    },
    {
      "name": "NamesNeverReplace",
      "kind": "invariant",
      "says": "Completed delivery callbacks for different tasks never use the same statue filename.",
      "sha256": "sha256:f9161bb9c04e37c153cd734c79418e59acb9f1a3bb8fc9b7921fc2543cd1418d"
    },
    {
      "name": "OneTaskAtATime",
      "kind": "invariant",
      "says": "Within a mount, start and recovery never enter over in-flight work, and the running guard stays held through download and delivery.",
      "sha256": "sha256:9ef7b0d5bed23514eb9b77a63be3860949f64d47062388ff5d91ad5799289413"
    },
    {
      "name": "ClearBlocksFutureRecovery",
      "kind": "invariant",
      "says": "Clear prevents later recovery of its task, while work adopted before Clear may still invoke and complete delivery.",
      "sha256": "sha256:0c707a00a6fd796671c6ee4a00bb052ad6aeb715a7ef52fe56df8dae8018c988"
    },
    {
      "name": "ErrorsReleaseTheHook",
      "kind": "invariant",
      "says": "A start, task, download, delivery, or fifth consecutive poll failure settles with its error and releases the hook for another start.",
      "sha256": "sha256:45f6445865edcba75a1bd2e61342263144e48a471088e07c14e05ef0a18b2de0"
    },
    {
      "name": "TypeOK",
      "kind": "invariant",
      "says": "The sidecar, mount, hook state, dismissal storage, and observation records stay within their declared types and bounds.",
      "sha256": "sha256:5ad8833d08b7e58f00e9b171005a34a4798efd75624fc460dda87a533093e265"
    },
    {
      "name": "CanSkipCompletedOnReload",
      "kind": "witness",
      "says": "A direct run completes a delivery without Clear, reloads, and observes recovery skip that freshly finished task.",
      "sha256": "sha256:7798197db09ed8327ce6e87cb2af6d99508e8fbac9f60cb4e42b6f908c59e3cf"
    },
    {
      "name": "CanRecoverSecondStatue",
      "kind": "witness",
      "says": "A direct run delivers recovered task 1, then reloads and delivers recovered task 2 under a different filename.",
      "sha256": "sha256:95abfa5f0730c0c183aafb786de729a069397a4ce2ccfbb13252d370f0d69a60"
    },
    {
      "name": "CanDeliverAfterClear",
      "kind": "witness",
      "says": "An already-adopted task can complete its delivery callback after Clear.",
      "sha256": "sha256:62de426d7e0bc34b90ee1aba9ce6faf14253b0038db3184e2d3200a58a493edf"
    },
    {
      "name": "CanRetryRejectedAfterReload",
      "kind": "witness",
      "says": "A direct run rejects a delivery, reloads, and successfully delivers the same task.",
      "sha256": "sha256:395df5ac168169afb77863978b32e4e1159310cf5084c5ecc0cd7475e638fddc"
    },
    {
      "name": "CanRetryRejectedOnSamePage",
      "kind": "witness",
      "says": "A direct run rejects a fresh task delivery and retries it on the same page with its original filename.",
      "sha256": "sha256:4ad246808588fb04fae4cf1a07544e8269d8aebedca38981c8001e3feba7575e"
    },
    {
      "name": "CanStartAfterError",
      "kind": "witness",
      "says": "After an error the hook can accept another start.",
      "sha256": "sha256:66a10104b46fa2ebce9e826be4afdec2c1599d9e59dfa4c90c1ae7a5e8dfb6fc"
    },
    {
      "name": "ReplayCompletedTask",
      "kind": "bug",
      "says": "A mistaken recovery adopts a task whose delivery already completed and delivers it again.",
      "expect": "DeliveredAtMostOnce",
      "sha256": "sha256:7345e51399f26c10056bee5954c374af54889761783b5dc1d743f300905be329"
    },
    {
      "name": "ReuseRecoveredName",
      "kind": "bug",
      "says": "A mistaken recovery gives two different recovered statues the same filename, replacing the first on delivery.",
      "expect": "NamesNeverReplace",
      "sha256": "sha256:97b24b918c608e0104eba9a468f54e5d763513153cf08ff5b8def3008a358cc6"
    }
  ]
}
