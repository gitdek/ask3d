{
  "ratified": {
    "by": "gitdek",
    "at": "2026-11-09T16:22:38Z",
    "issue": 5,
    "comment": "https://github.com/gitdek/ask3d/issues/5#issuecomment-6745206516",
    "proposal": "sha256:2e4cfad1c52311cc31167d5966c894c83a756d8362d22188960d39f0aaa48af8"
  },
  "bounds": {
    "ErrorMessages": "{\"\", \"worker crashed\"}",
    "MaxDeliveries": "2",
    "Models": "{model1, model2}"
  },
  "statements": [
    {
      "name": "Spec",
      "kind": "spec",
      "says": "The compile starts in Init, and every step is a Next step.",
      "sha256": "sha256:c06177101f662e93802a310062cf77a0dbab60efb85ad9dc2904441e5878ed84"
    },
    {
      "name": "SingleSettlement",
      "kind": "invariant",
      "says": "The promise has no settlements while pending and exactly one once it resolves or rejects.",
      "sha256": "sha256:37678ddd02e2995cdfc604a88ddb30a109d99c879989e60347cfdfdf9d13bac0"
    },
    {
      "name": "FirstSignalWins",
      "kind": "invariant",
      "says": "The first delivered signal determines whether the promise resolves with its model or rejects with its prescribed error, and later signals preserve that outcome.",
      "sha256": "sha256:79f5a43f38737d002a60d4deec8e2fc61c0881eaaef79c8164cd0ced54b30404"
    },
    {
      "name": "WorkerTerminatedAfterSettlement",
      "kind": "invariant",
      "says": "Whenever the promise has settled, its worker has been terminated.",
      "sha256": "sha256:67518b1a665cbcbf98df8d98bfc535e9ebd1a28ed78c1a698353623679de6f16"
    },
    {
      "name": "TimerInactiveAfterSettlement",
      "kind": "invariant",
      "says": "Whenever the promise has settled, its timer is inactive because it was cleared or its one-shot timeout expired.",
      "sha256": "sha256:3f925bb894ff6209ae67ecce6563ebaaaba1a3069a1cd29db16a4f449fab4391"
    },
    {
      "name": "TypeOK",
      "kind": "invariant",
      "says": "Every recorded event, promise outcome, counter and resource flag has its declared type.",
      "sha256": "sha256:1612690b22da1950229d79c0a5d2f392ada93d996c65b721745252af6b43d6ec"
    },
    {
      "name": "DoneWins",
      "kind": "witness",
      "says": "A worker's done response can arrive first and resolve the promise with its model.",
      "sha256": "sha256:cbf696b6e939a87114b9a6992a84cee9e054ef257d866c00fd9d30e026aeb7e0"
    },
    {
      "name": "FailureWins",
      "kind": "witness",
      "says": "A non-done worker response can arrive first and reject the promise with the compile-failure error.",
      "sha256": "sha256:b7f47c8818c6b4cd905c450c6501fbbffcf98884fad2d337be61b0065db18a1a"
    },
    {
      "name": "ErrorWins",
      "kind": "witness",
      "says": "A worker error can arrive first and reject the promise.",
      "sha256": "sha256:29e1faedc380ea5ce1b542167027478a32810e4a0b4875dbf8c639c708858ccd"
    },
    {
      "name": "TimeoutWins",
      "kind": "witness",
      "says": "The timeout can arrive first and reject the promise with the timeout error.",
      "sha256": "sha256:8efde36be53e33fb6faf6f0ba526198b9f2fc5b7d9066265335024c97f0b1e35"
    },
    {
      "name": "EmptyErrorUsesFallback",
      "kind": "witness",
      "says": "A worker error with an empty message can reject the promise with the fallback message worker error.",
      "sha256": "sha256:49a37dc7dab8831413dd56eb5f7661d0f22e1a7851b30fc2a2f8ade875aaf07c"
    },
    {
      "name": "LaterModelIgnored",
      "kind": "witness",
      "says": "A second done response carrying a different model can arrive without replacing the first model.",
      "sha256": "sha256:0d0db1ae9e0ed93b8da2cc68d40a6c0becd93c02f04bc99d4c7fc764f2cffc26"
    },
    {
      "name": "LateFailureIgnored",
      "kind": "witness",
      "says": "A failure response can arrive after success without changing the resolved outcome.",
      "sha256": "sha256:2aa4652ff68767bd4fc09ea726919e86a6703fddbb713f0eb8964a6e69c5c098"
    },
    {
      "name": "LateErrorIgnored",
      "kind": "witness",
      "says": "A worker error can arrive after success without changing the resolved outcome.",
      "sha256": "sha256:b45cafffee51d941739808fe4392a3e34205cac7376411df7f26cdc936aaa6f3"
    },
    {
      "name": "LateDoneAfterTimeoutIgnored",
      "kind": "witness",
      "says": "A done response can arrive after timeout without changing the timeout rejection.",
      "sha256": "sha256:7884ec0ac039d2249182003656ad207ed6fe28c0be9c104429993af88f9fb960"
    },
    {
      "name": "EventuallySettles",
      "kind": "property",
      "says": "The invocation eventually resolves or rejects.",
      "sha256": "sha256:e539bad32703415278d1c3699c97c7065ac93260b385456b6c810818ab7480e9"
    },
    {
      "name": "TimeoutProgress",
      "kind": "fairness",
      "says": "An active timer eventually runs its timeout callback if it stays active.",
      "sha256": "sha256:8a20ed150a21e8a53a1f6e040003da5cfbabf0d9dfea3c1e7f4a5861a3638362"
    },
    {
      "name": "BugSecondSettlement",
      "kind": "bug",
      "says": "A repeated done response incorrectly causes a second actual promise settlement.",
      "expect": "SingleSettlement",
      "sha256": "sha256:0cf469716f8f5712e59a8df936b6611146ab60a9b709778b648b5a210696ce0f"
    },
    {
      "name": "BugLateDoneOverwrites",
      "kind": "bug",
      "says": "A late done response incorrectly replaces the first outcome with its own model.",
      "expect": "FirstSignalWins",
      "sha256": "sha256:a121ba22c79396b9f5cf33c3831aa2fa328892a9bf7277f1f1a29e571983a0c8"
    },
    {
      "name": "BugTimeoutLeavesWorker",
      "kind": "bug",
      "says": "The timeout rejects the promise but forgets to terminate the worker.",
      "expect": "WorkerTerminatedAfterSettlement",
      "sha256": "sha256:49498b9150ff86120903b6bcc54c908f75561903cff443191655d02a3bc876b5"
    },
    {
      "name": "BugDoneLeavesTimer",
      "kind": "bug",
      "says": "A done response resolves the promise but forgets to clear the active timer.",
      "expect": "TimerInactiveAfterSettlement",
      "sha256": "sha256:1317d0a5076df308abed90905d2f38d5ed791a5f1140c744de7921367ad2aba5"
    }
  ]
}
