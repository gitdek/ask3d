{
  "ratified": {
    "by": "gitdek",
    "at": "2026-11-13T14:39:22Z",
    "issue": 43,
    "comment": "https://github.com/gitdek/ask3d/issues/43#issuecomment-6856126836",
    "proposal": "sha256:da8e588bd598e674a337b82494b644ac67ecb2544bbaf92e9fd1accf7ce410ce"
  },
  "bounds": {
    "MaxRepairs": "2",
    "NoProgram": "none",
    "Programs": "{p1, p2, p3}"
  },
  "statements": [
    {
      "name": "Spec",
      "kind": "spec",
      "says": "The hook starts idle and each settled input or callback follows the bounded model.",
      "sha256": "sha256:9629f85e886407ba7d73a71a8ccdd3d8d886eabbb5bac1f275e6b8bd148ffbd1"
    },
    {
      "name": "RepairReplyAccounted",
      "kind": "invariant",
      "says": "A finished reply containing a program during a pending repair must start a compile, send another counted repair, or show an error.",
      "sha256": "sha256:d017cfebbb53360ca3ad49fa300f2e64512bd0cceeb95964e771934f2c254908"
    },
    {
      "name": "TwoRepairsPerHuman",
      "kind": "invariant",
      "says": "At most two repair messages are sent per human message, and a new human message cancels the active compile and resets the allowance and repair state.",
      "sha256": "sha256:c9f1ec47df0d1231ecd08e1ca84884bed635fe8a80ef9fc05b6782dd2a43e97d"
    },
    {
      "name": "CurrentAndOnce",
      "kind": "invariant",
      "says": "A result or failure for a superseded program, or the same previously handled object delivered again, makes no callback call and changes no round or viewer state.",
      "sha256": "sha256:5d9c1657d61215346f0cbfd31b4e50e62fdd7dcf2e98406033ea2144345934ab"
    },
    {
      "name": "FinishedRoundIsClear",
      "kind": "invariant",
      "says": "The displayed attempt matches the internal counter, and accepting a model or showing an error leaves neither a counted attempt nor pending repair errors.",
      "sha256": "sha256:c4b115e236695388165e7a4510ddcead3468c25ebd9db004db1e01f1caa082c6"
    },
    {
      "name": "InfrastructureIsNotRepaired",
      "kind": "invariant",
      "says": "A fresh timeout or compiler-loading failure for the current program shows an error and sends no automatic repair.",
      "sha256": "sha256:524c758bb0a618b35a575730fd3a90d6069d59b01b74120c470c326e0803d079"
    },
    {
      "name": "SkipOnlyVisibleModel",
      "kind": "invariant",
      "says": "A program reply can be skipped only when its previously accepted model is still displayed and no repair is pending, so replacing that model removes the skip exemption.",
      "sha256": "sha256:f932ed8744e258e125378f9d78d425de93e4bd673dedba53da21a68b361c2046"
    },
    {
      "name": "TypeOK",
      "kind": "invariant",
      "says": "All sources, counters, phases, pending state and observed callback calls stay within their declared types for three programs and a two-repair limit.",
      "sha256": "sha256:a718e52b28590c592126531f2ca3e23b5d3b7bb5d93b27814c82f69e96ebbd80"
    },
    {
      "name": "ModelAccepted",
      "kind": "witness",
      "says": "A compiled model can be displayed and accepted.",
      "sha256": "sha256:7d321b921250bcc99d55cb726c14899a89bef89799f2e41b0717f45353aa2253"
    },
    {
      "name": "BudgetExhausted",
      "kind": "witness",
      "says": "A program fault can show an error after both automatic repairs have been sent.",
      "sha256": "sha256:98e94d908adcef3c6834e8ff7e21689eb0a9cabf4c115b7a9c2ac1457ceef16c"
    },
    {
      "name": "TimeoutShown",
      "kind": "witness",
      "says": "A timeout can be shown as an error.",
      "sha256": "sha256:4c15191d0302ad7741d915eb90eb206dc52b841af96e8af58c43e736ac76d467"
    },
    {
      "name": "CompilerUnavailableShown",
      "kind": "witness",
      "says": "A compiler-loading failure can be shown as an error.",
      "sha256": "sha256:32a7212e400011309cede20ae0824b4b572100ab8c1d098acc1355b8e53ebfeb"
    },
    {
      "name": "RepairReplyCompiled",
      "kind": "witness",
      "says": "A program in a pending repair's reply can start a new compile.",
      "sha256": "sha256:ed65a38dbf6a4f2d3d0fc768ebee9dc5e5ffb82c49ed3aa629da041deb57ba8d"
    },
    {
      "name": "IgnoreCachedRepairReply",
      "kind": "bug",
      "says": "The hook silently returns when a repair reply repeats the successful program still displayed, leaving the failing program's pending errors and counted attempt untouched.",
      "expect": "RepairReplyAccounted",
      "sha256": "sha256:3d7325917c78a45131705061a0cb80e42e87ee8ef97c2efe1a693455d0762345"
    },
    {
      "name": "KeepAttemptAfterError",
      "kind": "bug",
      "says": "A timeout during a repair shows an error but leaves the attempt counter set, as the current hook does.",
      "expect": "FinishedRoundIsClear",
      "sha256": "sha256:6d622856c0e48d62052662107e16f2179911da7c8f53f685c19cfd5f69f459c0"
    }
  ]
}
