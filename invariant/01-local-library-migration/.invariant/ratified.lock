  },
  "bounds": {
    "FirstKind": "\"image\"",
    "FirstName": "\"part\"",
    "ItemCount": "1",
    "MaxLoads": "2",
    "SecondKind": "\"mesh\"",
    "SecondName": "\"other\""
  },
  "statements": [
    {
      "name": "Spec",
      "kind": "spec",
      "says": "Each browser load follows the modeled migration steps within the checked bounds.",
      "sha256": "sha256:615ac2c996067dcdbf2435f9cf08f1d7361f079f120d9d59f387738bf8ba1e5d"
    },
    {
      "name": "DeleteOnlyWhenShared",
      "kind": "invariant",
      "says": "Deletion of the old database is requested only when every original local item is present in the shared library under the same kind and name.",
      "sha256": "sha256:f66a5d9113f923da8fc3406f69f3dd8d9b5c6e3b0507ebe1b2aad15a7d314fb6"
    },
    {
      "name": "CompletionRequiresAllShared",
      "kind": "invariant",
      "says": "The completion flag is never set while any original local item is still absent from the shared library.",
      "sha256": "sha256:6e23f32e7d982b1f4db66684cf3cd642249ac4d607bb4e7c633dfbb5088cbbfd"
    },
    {
      "name": "CompletedLoadsQuiet",
      "kind": "invariant",
      "says": "A load that starts with the completion flag makes no upload, flag-write, or database-deletion attempt.",
      "sha256": "sha256:a5505c0caa88cbdd104d2dc54993a53ba9afd1b2e381840e32699430fe737659"
    },
    {
      "name": "NoStorageWork",
      "kind": "invariant",
      "says": "When reading local storage is unavailable, migration makes no upload, flag-write, or database-deletion attempt.",
      "sha256": "sha256:eaa2240db7a556e34e26de7a9c761256e9cd2cde6c365005954da5d74f2424bd"
    },
    {
      "name": "NoAbsentLibraryCopy",
      "kind": "invariant",
      "says": "A browser with no old database uploads no items and requests no database deletion.",
      "sha256": "sha256:db06c80a3930441be426e806ee32bbef9d88ad6539001ba722fcdccbe853176a"
    },
    {
      "name": "UploadOnlyNewKeys",
      "kind": "invariant",
      "says": "An item is read for upload only if the shared-library listing lacks its exact kind and name.",
      "sha256": "sha256:056a25d1776112adf84492152fcabf0700b6c17e9e3506d2962d20d97a5f1ddd"
    },
    {
      "name": "TypeOK",
      "kind": "invariant",
      "says": "All stored values, migration phases, item sets, and observed operation counts stay within their declared types and bounds.",
      "sha256": "sha256:fe73380c85023dc63079ecba3b99ceceea985fd4d8482148f76f28c6259b3877"
    },
    {
      "name": "CopiedAndCompleted",
      "kind": "witness",
      "says": "Migration can upload local items, mark completion, and request deletion after every local item is shared.",
      "sha256": "sha256:ddf5e292ceb3308494060d6bbb75a9fadae9f49eee6e3ebe382117985004b385"
    },
    {
      "name": "AlreadySharedCompleted",
      "kind": "witness",
      "says": "Migration can finish without uploads when every local item already exists under its kind and name.",
      "sha256": "sha256:481c8892d33544453950ab04e64b38a567421d3bb5e40f1dd3830667daec1b44"
    },
    {
      "name": "LaterLoadQuiet",
      "kind": "witness",
      "says": "A second load after completion can return without making any further writes.",
      "sha256": "sha256:e5fa4d21fd456f91845147bd715da571213fc5536428d3196445c396eb8df92e"
    },
    {
      "name": "AbsentLibrarySkipped",
      "kind": "witness",
      "says": "A load with no old database can record completion without uploading or deleting anything.",
      "sha256": "sha256:526554f0dacf29134fe79a7083cf81ae7ec8a281f9d21803bef5ca16b9c8d0a1"
    },
    {
      "name": "AbsentStorageSkipped",
      "kind": "witness",
      "says": "A load without readable local storage can return without writing anything.",
      "sha256": "sha256:b94d2a7f6f9f6bcece7d0330a4f43b3f4ad1bce9c8824714ecf7f1faeb7fea8b"
    },
    {
      "name": "EmptyLibraryCompleted",
      "kind": "witness",
      "says": "An existing empty local database can be marked complete and scheduled for deletion without uploads.",
      "sha256": "sha256:747ff5c681fbd245ce2b9856b3d374fddf36e085595e65c8e94a065ba3c4f3fa"
    },
    {
      "name": "UnreadableRetained",
      "kind": "witness",
      "says": "An item with unreadable bytes can remain local with migration still eligible for a later load.",
      "sha256": "sha256:50b2f716f84909bfd1c164941b5c66ab56708f7ff81bc010c84f001da7007234"
    },
    {
      "name": "FailedUploadRetained",
      "kind": "witness",
      "says": "An item whose upload failed can remain local with migration still eligible for a later load.",
      "sha256": "sha256:6998d824b4a73cbf8b65f325d95ea41aec1d3df4ce28edd34a779c3d9f00f740"
    },
    {
      "name": "FailedItemRetried",
      "kind": "witness",
      "says": "A second load can attempt to read an item left uncopied by a first-load read or upload failure.",
      "sha256": "sha256:edd62377f17a46489025dfdc39fa74b6f871db3bb276e385c25a789e97218494"
    },
    {
      "name": "MetadataFailureRetained",
      "kind": "witness",
      "says": "A metadata-read failure can leave an incomplete local library intact and unmarked for a later load.",
      "sha256": "sha256:948de16673474d2250b035fd1c92e921bcbf210ba5d314e8fdbd0d1201006e7e"
    },
    {
      "name": "DeleteIncomplete",
      "kind": "bug",
      "says": "Migration requests deletion while at least one local item has no shared copy.",
      "expect": "DeleteOnlyWhenShared",
      "sha256": "sha256:99a3ff40bd0b0914de8905a391b2f6a8ebfed494847b4774ce2ea1ab82705b69"
    },
    {
      "name": "CompleteDespiteUnreadableBytes",
      "kind": "bug",
      "says": "Migration proceeds to mark completion after silently skipping an unreadable item that has no shared copy.",
      "expect": "CompletionRequiresAllShared",
      "sha256": "sha256:87dcd49c1d0db8353c9242132eada16edb92b3f8d12dcc925b081fc48457e6db"
    },
    {
      "name": "CompleteDespiteUploadFailure",
      "kind": "bug",
      "says": "Migration proceeds to mark completion even though an upload failed and the item is still absent from the shared library.",
      "expect": "CompletionRequiresAllShared",
      "sha256": "sha256:6e17082d49c0c073875d5c28b8d3c547e7bfa98a13103295ba7729d668aaf496"
    },
    {
      "name": "WriteAfterCompletion",
      "kind": "bug",
      "says": "A later load writes the completion flag again despite finding it already set.",
      "expect": "CompletedLoadsQuiet",
      "sha256": "sha256:ee7e4e79eef530e548c58e276cfdbea31399851d26abeb1993926673c2223811"
    }
  ]
}
