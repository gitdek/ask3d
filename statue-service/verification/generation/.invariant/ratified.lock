{
  "decision": "D-0001",
  "bounds": {
    "MaxTasks": "2"
  },
  "statements": [
    {
      "name": "Spec",
      "kind": "spec",
      "says": "The service starts with no tasks. Each submission queues a task, each worker finishes its task, a statue's model is served only for a task that succeeded, and once every task has ended the service waits.",
      "sha256": "sha256:61889c4c81a65f9eb4d7d8a6c25319ab1d811c1baa5fdfc5a8cbac788b02afe6"
    },
    {
      "name": "OneAtATime",
      "kind": "invariant",
      "says": "At most one statue is queued or being generated at a time.",
      "sha256": "sha256:2bbf59ac73c56cc6c743b05c547ab0ee5a24a4c6925fe2797510c7adc0ce4d4f"
    },
    {
      "name": "Known",
      "kind": "invariant",
      "says": "Every task is queued, running, succeeded or failed.",
      "sha256": "sha256:bfdfaf7adf71c048d5b60823c42f7eb4aaa55d944f788ab75ffd152aafc1b626"
    },
    {
      "name": "AllDone",
      "kind": "witness",
      "says": "Statues can be generated one after another until no more are submitted.",
      "sha256": "sha256:b22d0221d9e0e0a50b402400cc9702515f2bcee1878c12da832b9ee089719e23"
    },
    {
      "name": "DoubleSubmit",
      "kind": "bug",
      "says": "A submission that didn't check the slot would let two statues generate at once.",
      "expect": "OneAtATime",
      "sha256": "sha256:e4b34113215aff9c143f5ee35072180638c8cb5fae2c79fcd17c0428256505a3"
    },
    {
      "name": "Fair",
      "kind": "fairness",
      "says": "A queued statue whose worker can finish eventually does.",
      "sha256": "sha256:f2847565753b7a43ab047e312b407d1a3d263d08a5e4cc28734e87812fabb2fa"
    },
    {
      "name": "Ends",
      "kind": "property",
      "says": "Every statue that starts generating eventually ends, freeing the slot.",
      "sha256": "sha256:db4b916c181f104ce742a6aad4245767c745aa9dfdde0d1621c54ac5f4ee7e73"
    }
  ]
}
